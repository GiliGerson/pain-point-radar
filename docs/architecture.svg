<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="330" fill="#eef2ef"/>
  <rect x="20" y="20" width="500" height="290" rx="10" fill="none" stroke="#18302d" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="36" y="44" font-weight="700" fill="#18302d">Your browser (static site, no backend)</text>

  <g fill="#f7f9f7" stroke="#586b67">
    <rect x="40" y="64" width="140" height="56" rx="6"/>
    <rect x="40" y="150" width="140" height="56" rx="6"/>
    <rect x="210" y="150" width="140" height="56" rx="6"/>
    <rect x="370" y="150" width="130" height="56" rx="6"/>
    <rect x="210" y="240" width="290" height="50" rx="6"/>
  </g>
  <g fill="#18302d" text-anchor="middle">
    <text x="110" y="88" font-weight="700">Settings</text>
    <text x="110" y="106" fill="#586b67">topic, range, API key</text>
    <text x="110" y="174" font-weight="700">Source adapter</text>
    <text x="110" y="192" fill="#586b67">HN on, Reddit off</text>
    <text x="280" y="174" font-weight="700">Stage 1: extract</text>
    <text x="280" y="192" fill="#586b67">Haiku, batched</text>
    <text x="435" y="174" font-weight="700">Stage 2: cluster</text>
    <text x="435" y="192" fill="#586b67">Sonnet, once</text>
    <text x="355" y="262" font-weight="700">Report</text>
    <text x="355" y="279" fill="#586b67">themes, severity, verified quotes, export</text>
  </g>
  <g stroke="#18302d" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M110 120 V146"/>
    <path d="M180 178 H206"/>
    <path d="M350 178 H366"/>
    <path d="M435 206 V236"/>
  </g>

  <g fill="#f2dcc3" stroke="#d9822b">
    <rect x="560" y="80" width="180" height="56" rx="6"/>
    <rect x="560" y="200" width="180" height="56" rx="6"/>
  </g>
  <g fill="#18302d" text-anchor="middle">
    <text x="650" y="104" font-weight="700">hn.algolia.com</text>
    <text x="650" y="122" fill="#586b67">public search API</text>
    <text x="650" y="224" font-weight="700">api.anthropic.com</text>
    <text x="650" y="242" fill="#586b67">user's own key</text>
  </g>
  <g stroke="#d9822b" stroke-width="1.5" fill="none" stroke-dasharray="4 3">
    <path d="M180 160 H195 V56 H540 V108 H556"/>
    <path d="M280 150 V132 H540 V228 H556"/>
    <path d="M435 150 V132"/>
  </g>
  <text x="560" y="300" fill="#586b67" font-size="12">CSP allows only these two hosts</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#18302d"/></marker></defs>
</svg>
